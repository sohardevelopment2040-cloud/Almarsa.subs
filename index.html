<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حملة تجميع الرسوم لشراء كرات والالتزامات الأخرى - أغسطس 2026</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حملة الرسوم">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <style>
        body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    </style>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--bg-color);
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .header .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-card.paid { background: #f0fdf4; border-color: #bbf7d0; }
        .stat-card.unpaid { background: #fef2f2; border-color: #fecaca; }
        .stat-card.money { background: #eff6ff; border-color: #bfdbfe; }

        .stat-card .title { font-size: 0.8rem; color: var(--text-muted); }
        .stat-card .number { font-size: 1.2rem; font-weight: bold; margin-top: 4px; }

        .stat-card.paid .number { color: var(--success); }
        .stat-card.unpaid .number { color: var(--danger); }
        .stat-card.money .number { color: var(--primary); }

        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 140px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-whatsapp { background: #25d366; color: white; }
        .btn-whatsapp:hover { background: #1eb956; }

        .btn-danger { background: #fff1f2; color: var(--danger); border: 1px solid #fecaca; }
        .btn-danger:hover { background: #fee2e2; }

        .members-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .member-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .member-card:hover { background: #f8fafc; }
        .member-card.is-paid { background: #f0fdf4; border-color: #bbf7d0; }

        .member-info { display: flex; align-items: center; gap: 12px; flex: 1; }
        .member-num { font-size: 0.85rem; color: var(--text-muted); min-width: 28px; }
        .member-name { font-weight: 500; font-size: 0.95rem; }
        
        .member-status-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .check-marks {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            justify-content: flex-end;
            max-width: 260px;
            color: var(--success);
            font-size: 1.05rem;
            line-height: 1;
        }

        .check-mark {
            color: var(--success);
            font-weight: bold;
        }

        .notes-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .notes-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #7f1d1d;
        }

        #generalNotes {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            padding: 12px;
            border: 2px solid #7f1d1d;
            border-radius: 10px;
            color: #7f1d1d;
            background: #fff7f7;
            font-size: 1rem;
            line-height: 1.7;
            outline: none;
        }

        #generalNotes:focus {
            border-color: #991b1b;
            box-shadow: 0 0 0 3px rgba(127, 29, 29, 0.08);
        }

        .btn-exit {
            background: #7f1d1d;
            color: white;
        }

        .btn-exit:hover {
            background: #5f1515;
        }

        .status-box {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .member-card.is-paid .status-box {
            background: #dcfce7;
            color: var(--success);
            border-color: #bbf7d0;
        }

        /* النافذة التفاعلية (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .modal p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            border: 2px solid var(--primary);
            border-radius: 8px;
            margin-bottom: 16px;
            outline: none;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-preset {
            padding: 8px;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-preset:hover {
            background: #e2e8f0;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>حملة تجميع الرسوم لشراء كرات ⚽️ والالتزامات الأخرى 🧊</h1>
        <div class="subtitle">أغسطس ٢٠٢٦</div>
    </div>

    <!-- الإحصائيات -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="title">الأعضاء</div>
            <div class="number" id="totalCount">0</div>
        </div>
        <div class="stat-card paid">
            <div class="title">المسددين</div>
            <div class="number" id="paidCount">0</div>
        </div>
        <div class="stat-card unpaid">
            <div class="title">المتبقين</div>
            <div class="number" id="unpaidCount">0</div>
        </div>
        <div class="stat-card money">
            <div class="title">المبلغ المحصل</div>
            <div class="number" id="totalAmount">0 ر.ع</div>
        </div>
    </div>

    <!-- شريط الأزرار -->
    <div class="actions-bar">
        <button class="btn btn-primary" onclick="addMember()">➕ إضافة عضو</button>
        <button class="btn btn-whatsapp" onclick="copyAndShareWhatsApp()">💬 نسخ التقرير ولصقه بالواتساب</button>
        <button class="btn btn-danger" onclick="resetData()">🗑️ تفريغ البيانات</button>
        <button class="btn btn-exit" onclick="exitProgram()">💾 حفظ وخروج</button>
    </div>

    <!-- الملاحظات -->
    <div class="notes-section">
        <label for="generalNotes">📝 الملاحظات</label>
        <textarea id="generalNotes" placeholder="اكتب الملاحظات هنا..."></textarea>
    </div>

    <!-- قائمة الأعضاء -->
    <div class="members-list" id="membersList"></div>
</div>

<!-- النافذة التفاعلية لإدخال المبلغ -->
<div class="modal-overlay" id="paymentModal">
    <div class="modal">
        <h3 id="modalMemberName">اسم العضو</h3>
        <p>أدخل المبلغ المدفوع (ريال عماني):</p>
        
        <input type="number" id="modalAmountInput" min="0" step="0.5" placeholder="0">
        
        <!-- أزرار سريعة للأرقام الشائعة -->
        <div class="preset-buttons">
            <button class="btn-preset" onclick="setPresetAmount(1)">1 ر.ع</button>
            <button class="btn-preset" onclick="setPresetAmount(5)">5 ر.ع</button>
            <button class="btn-preset" onclick="setPresetAmount(10)">10 ر.ع</button>
            <button class="btn-preset" onclick="setPresetAmount(15)">15 ر.ع</button>
            <button class="btn-preset" onclick="setPresetAmount(20)">20 ر.ع</button>
            <button class="btn-preset" onclick="setPresetAmount(50)">50 ر.ع</button>
        </div>

        <div class="modal-actions">
            <button class="btn btn-primary" onclick="confirmPayment()">تأكيد</button>
            <button class="btn btn-danger" style="background:#f1f5f9; color:#64748b; border:none;" onclick="cancelPayment()">إلغاء/مسح</button>
        </div>
    </div>
</div>

<!-- النافذة التفاعلية لإضافة عضو جديد -->
<div class="modal-overlay" id="addMemberModal">
    <div class="modal">
        <h3>إضافة عضو جديد</h3>
        <p>أدخل اسم العضو الجديد:</p>

        <input type="text" id="newMemberNameInput" placeholder="اسم العضو">

        <div class="modal-actions">
            <button class="btn btn-primary" onclick="confirmAddMember()">إضافة</button>
            <button class="btn btn-danger" style="background:#f1f5f9; color:#64748b; border:none;" onclick="closeAddMemberModal()">إلغاء</button>
        </div>
    </div>
</div>

<script>
    const defaultNames = [
        "عبدالله سعيد", "وليد سعيد", "أحمد الخان", "أحمد ع الخان (غير موجود)",
        "عبدالرحمن الخان", "حسين سويلم", "إبراهيم سويلم", "سعيد عبدالله",
        "محمد عبدالله", "سالم العاقور", "يوسف العاقور", "معتصم العاقور",
        "خالد المسكدي", "علي المسكدي", "إبراهيم سالم", "علي سالم",
        "حسام", "عيسى عبدالله سالم", "عيسى خلفان", "محمد الدرمكي",
        "هارون أحمد", "عيسى صالح", "أحمد سعيد", "محمد سعيد",
        "أحمد حسن حبيب", "هلال ناصر", "سيف بالاسود", "سالم ربيع",
        "محمد الغيثي", "عبدالله الهنداسي", "محمد الروش", "جمعة خدوم",
        "حسن عبدالله", "خالد البسطي", "عيسى بريك", "محمد الطويل",
        "يوسف دريهم", "أحمد البرختي", "جاسم محمد", "محمد المسكدي",
        "حمد الرواحي", "عبدالله يوسف"
    ];

    let savedData = localStorage.getItem('campaign_members_v5');
    let members = [];
    let selectedIndex = null;
    const notesKey = 'campaign_general_notes_v1';

    if (savedData && JSON.parse(savedData).length > 0) {
        members = JSON.parse(savedData);
    } else {
        members = defaultNames.map(name => ({ name, paid: false, amount: 0 }));
        localStorage.setItem('campaign_members_v5', JSON.stringify(members));
    }

    function saveData() {
        localStorage.setItem('campaign_members_v5', JSON.stringify(members));
        render();
    }

    function getCheckCount(amount) {
        const value = Math.floor(parseFloat(amount) || 0);
        return Math.max(0, value);
    }

    function renderCheckMarks(amount) {
        const count = getCheckCount(amount);
        if (count === 0) return '';
        return `<div class="check-marks" title="${amount} ر.ع">${Array.from({ length: count }, () => '<span class="check-mark">✓</span>').join('')}</div>`;
    }

    function loadNotes() {
        const notesEl = document.getElementById('generalNotes');
        if (notesEl) notesEl.value = localStorage.getItem(notesKey) || '';
    }

    function saveNotes() {
        const notesEl = document.getElementById('generalNotes');
        if (notesEl) localStorage.setItem(notesKey, notesEl.value);
    }

    function render() {
        const listEl = document.getElementById('membersList');
        listEl.innerHTML = '';

        let paidCount = 0;
        let totalCollected = 0;

        members.forEach((m, index) => {
            const isPaid = m.paid && m.amount > 0;
            if (isPaid) {
                paidCount++;
                totalCollected += parseFloat(m.amount) || 0;
            }

            const card = document.createElement('div');
            card.className = `member-card ${isPaid ? 'is-paid' : ''}`;
            card.onclick = () => openPaymentModal(index);

            card.innerHTML = `
                <div class="member-info">
                    <span class="member-num">${index + 1}.</span>
                    <span class="member-name">${m.name}</span>
                </div>
                <div class="member-status-container">
                    ${isPaid ? renderCheckMarks(m.amount) : ''}
                    <div class="status-box">${isPaid ? '✓' : '❌'}</div>
                </div>
            `;
            listEl.appendChild(card);
        });

        document.getElementById('totalCount').innerText = members.length;
        document.getElementById('paidCount').innerText = paidCount;
        document.getElementById('unpaidCount').innerText = members.length - paidCount;
        document.getElementById('totalAmount').innerText = `${totalCollected} ر.ع`;
    }

    function openPaymentModal(index) {
        selectedIndex = index;
        const member = members[index];
        document.getElementById('modalMemberName').innerText = member.name;
        document.getElementById('modalAmountInput').value = member.amount > 0 ? member.amount : '';
        document.getElementById('paymentModal').classList.add('active');
        document.getElementById('modalAmountInput').focus();
    }

    function setPresetAmount(val) {
        document.getElementById('modalAmountInput').value = val;
    }

    function confirmPayment() {
        if (selectedIndex !== null) {
            const val = parseFloat(document.getElementById('modalAmountInput').value);
            if (!isNaN(val) && val > 0) {
                members[selectedIndex].paid = true;
                members[selectedIndex].amount = val;
            } else {
                members[selectedIndex].paid = false;
                members[selectedIndex].amount = 0;
            }
            saveData();
            closePaymentModal();
        }
    }

    function cancelPayment() {
        if (selectedIndex !== null) {
            members[selectedIndex].paid = false;
            members[selectedIndex].amount = 0;
            saveData();
            closePaymentModal();
        }
    }

    function closePaymentModal() {
        document.getElementById('paymentModal').classList.remove('active');
        selectedIndex = null;
    }

    function addMember() {
        document.getElementById('newMemberNameInput').value = '';
        document.getElementById('addMemberModal').classList.add('active');
        document.getElementById('newMemberNameInput').focus();
    }

    function closeAddMemberModal() {
        document.getElementById('addMemberModal').classList.remove('active');
    }

    function confirmAddMember() {
        const name = document.getElementById('newMemberNameInput').value.trim();
        if (name) {
            members.push({ name: name, paid: false, amount: 0 });
            saveData();
        }
        closeAddMemberModal();
    }

    function resetData() {
        if (confirm("هل أنت متأكد من تفريغ جميع البيانات وإعادة الجميع إلى حالة عدم السداد، بما في ذلك الملاحظات؟")) {
            // إعادة الأعضاء إلى الحالة الافتراضية
            members = defaultNames.map(name => ({ name, paid: false, amount: 0 }));

            // تفريغ حقل الملاحظات وحذفها من الحفظ المحلي
            const notesEl = document.getElementById('generalNotes');
            if (notesEl) notesEl.value = '';
            localStorage.removeItem(notesKey);

            // حفظ التغييرات وتحديث الشاشة
            saveData();
        }
    }

    function copyAndShareWhatsApp() {
        const total = members.length;
        const paidMembers = members.filter(m => m.paid && m.amount > 0);
        const paidCount = paidMembers.length;
        const unpaidCount = total - paidCount;
        const totalMoney = members.reduce((sum, m) => sum + (parseFloat(m.amount) || 0), 0);

        let text = `*حملة تجميع الرسوم لشراء كرات ⚽️ والالتزامات الأخرى 🧊*\n`;
        text += `*أغسطس ٢٠٢٦*\n\n`;
        text += `📊 *الإحصائيات:* \n`;
        text += `▪️ إجمالي الأعضاء: ${total}\n`;
        text += `✅ المسددين: ${paidCount}\n`;
        text += `❌ المتبقين: ${unpaidCount}\n`;
        text += `💰 إجمالي المبلغ المحصل: ${totalMoney} ر.ع\n\n`;
        text += `📋 *الكشف:* \n`;

        members.forEach((m, i) => {
            const isPaid = m.paid && m.amount > 0;
            const checks = isPaid ? '✓'.repeat(getCheckCount(m.amount)) : '❌';
            text += `${i + 1}- ${m.name} ${checks}\n`;
        });

        const notes = (document.getElementById('generalNotes')?.value || '').trim();
        if (notes) {
            text += `\n📝 *الملاحظات:*\n${notes}\n`;
        }

        navigator.clipboard.writeText(text).then(() => {
            alert("تم نسخ التقرير بنجاح! سيتم فتح الواتساب الآن، قم بلصق الرسالة في المحادثة.");
            window.location.href = "https://wa.me/";
        }).catch(() => {
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("تم نسخ التقرير بنجاح! قم بلصقه في الواتساب.");
            window.location.href = "https://wa.me/";
        });
    }

    function exitProgram() {
        // حفظ جميع البيانات والملاحظات أولاً
        localStorage.setItem('campaign_members_v5', JSON.stringify(members));
        saveNotes();

        if (!confirm('تم حفظ البيانات. هل تريد الخروج من البرنامج؟')) return;

        // محاولة الإغلاق المباشر (تعمل في بعض المتصفحات وكتطبيق PWA)
        window.close();

        // إذا منع المتصفح الإغلاق، ننتقل لصفحة فارغة كخروج من واجهة البرنامج
        setTimeout(() => {
            if (!document.hidden) {
                window.location.replace('about:blank');
            }
        }, 250);
    }

    document.getElementById('generalNotes')?.addEventListener('input', saveNotes);

    // إغلاق نافذة إضافة العضو عند الضغط على Enter
    document.getElementById('newMemberNameInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmAddMember();
    });

    loadNotes();
    render();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
</script>
</body>
</html>
